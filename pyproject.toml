[project]
name = "pynwcd"
version = "0.1.0"
description = "pynwcd"
readme = "README.md"
requires-python = ">=3.14.8"
dependencies = []

[project.optional-dependencies]
dev = ["ipdb", "mypy", "ruff"]
test = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["nwcd.py", "ptp.py", "tracker.py"]

[tool.ruff]
line-length = 88
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Legacy exploratory code: unused locals and loop variables, %-formatting,
# lambdas and zip() without strict are left as written
ignore = ["B007", "F841"]

[tool.mypy]
ignore_missing_imports = true

[tool.pytest.ini_options]
python_files = ["*_test.py"]
